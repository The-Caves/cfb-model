name: CFB Home-Bias Candidate Evaluation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/home_bias_candidate.py'
      - 'tests/test_home_bias_candidate.py'
      - '.github/workflows/cfb-home-bias-eval.yml'
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run chronology and no-leakage unit tests
        run: python -m unittest discover -s tests -p 'test_home_bias_candidate.py' -v
      - name: Retrieve exact October 24 frozen 2026 research data
        uses: actions/download-artifact@v4
        with:
          repository: The-Caves/cfb-model
          run-id: 40100613531
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: cfb-2026-data-40100613531
          path: .original-intake
      - name: Compare active V03 vs eligibility and recency ablations
        run: |
          python -m scripts.home_bias_candidate \
            --features .original-intake/model_v03/weekly_pregame_features.csv \
            --labels .original-intake/model_v03/weekly_postgame_labels.csv \
            --output data/model_v03/home-bias-candidate-research.json
      - name: Enforce baseline identity and prevent automatic promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('data/model_v03/home-bias-candidate-research.json').read_text())
          assert v['status']=='RETROSPECTIVE_RESEARCH_ONLY'
          assert v['betting_status']=='PASS_UNVALIDATED'
          assert v['forecast_promotion'] is False
          assert v['historical_feature_publication_verified'] is False
          assert v['active_model']=='V03_RIDGE_OBSERVED_PROSPECTIVE_BASE14_V1'
          assert v['aggregate']['active_all_training_games']['games']>=200
          assert len(v['folds'])>=3
          for f in v['folds']:
              assert max(f['train_game_ids_sorted'],default='')!=None
              assert not set(f['train_game_ids_sorted']) & set(f['test_game_ids_sorted'])
          print(json.dumps(v['aggregate'],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: home-bias-research-candidate-${{ github.run_id }}
          path: data/model_v03/home-bias-candidate-research.json
          retention-days: 30
