name: CFB 2026 Observed Final Settlement
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 10 * 1,8-12 *'
permissions:
  contents: write
concurrency:
  group: cfb-context-state
  cancel-in-progress: false
jobs:
  settle:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-settle]')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate chronology and archive safeguards
        run: python -m unittest discover -s tests -v
      - name: Gate strictly to the 2026 football season
        id: gate
        run: |
          YM="$(date -u +%Y%m)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$YM" =~ ^2026(08|09|10|11|12)$ || "$YM" == "202701" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Outside 2026 CFB season; skip external data requests." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch freshly observed completed ESPN games from last 28 days
        if: steps.gate.outputs.run == 'true'
        run: |
          START="$(date -u -d '28 days ago' +%F)"
          python scripts/ingest_espn.py --start "$START" --output data/settlement_scores
      - name: Collect explicitly flagged completed-game QB starters (UNKNOWN unless source says starter)
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m scripts.qb_postgame_starter_labels \
            --games data/settlement_scores/games_2026.csv \
            --output "data/settlement_scores/qb-postgame-evidence-${{ github.run_id }}.json"
      - name: Append postgame QB labels with source hashes and conflict quarantine
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m scripts.qb_postgame_starter_archive \
            --input "data/settlement_scores/qb-postgame-evidence-${{ github.run_id }}.json" \
            --output "data/settlement_scores/qb-postgame-ledger-${{ github.run_id }}.json" | tee /tmp/qb-starter-ledger.txt
          cat /tmp/qb-starter-ledger.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Observe manually reviewed official university QB starting lineups
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m scripts.qb_official_school_boxscores \
            --games data/settlement_scores/games_2026.csv \
            --registry config/official_school_qb_boxscores_2026.json \
            --output "data/settlement_scores/qb-official-gamebook-${{ github.run_id }}.json"
      - name: Persist gamebook actual starters separately from QB passing leaders
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m scripts.qb_postgame_starter_archive \
            --input "data/settlement_scores/qb-official-gamebook-${{ github.run_id }}.json" \
            --output "data/settlement_scores/qb-official-gamebook-ledger-${{ github.run_id }}.json" | tee /tmp/qb-official-gamebook-ledger.txt
          cat /tmp/qb-official-gamebook-ledger.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Read immutable context-state as local Git tree for QB source/forecast audit
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: context-state
          path: .context-state
          persist-credentials: false
      - name: Pair frozen pregame QB scenarios with independently accepted postgame starter labels
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m scripts.qb_starter_supervised \
            --registry config/official_school_qb_boxscores_2026.json \
            --archive-root .context-state \
            --review-csv "data/settlement_scores/qb-starter-source-review-${{ github.run_id }}.csv" \
            --output "data/settlement_scores/qb-starter-trainability-${{ github.run_id }}.json" | tee /tmp/qb-supervised.txt
          cat /tmp/qb-supervised.txt >> "$GITHUB_STEP_SUMMARY"
          echo "QB starter model is NOT trained unless enough audited prospective labels exist." >> "$GITHUB_STEP_SUMMARY"
      - name: Link only existing pregame captures to observed finals (no new pregame input)
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m scripts.personnel_results_archive \
            --settle-only \
            --games data/settlement_scores/games_2026.csv \
            --manifest data/settlement_scores/manifest.json \
            --output "data/settlement_scores/settlement-${{ github.run_id }}.json"
      - name: Audit archived pregame-to-final dataset and walk-forward readiness (Step 3E)
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m scripts.personnel_archive_dataset \
            --output "data/settlement_scores/step3e-${{ github.run_id }}"
      - name: Check prospective model-validation readiness (Step 3F)
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m scripts.personnel_validation_readiness \
            --dataset-dir "data/settlement_scores/step3e-${{ github.run_id }}" \
            --output "data/settlement_scores/step3e-${{ github.run_id }}/step3f-readiness.json"
      - name: Grade genuinely observed prospective forecasts (Step 3G.1)
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m scripts.personnel_forecast_grade \
            --output "data/settlement_scores/step3g-grading-${{ github.run_id }}.json"
      - name: Consolidated model finish-line and graded performance audit
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m scripts.model_finishline \
            --readiness "data/settlement_scores/step3e-${{ github.run_id }}/step3f-readiness.json" \
            --grading "data/settlement_scores/step3g-grading-${{ github.run_id }}.json" \
            --output "data/settlement_scores/model-finishline-${{ github.run_id }}.json"
      - name: Preserve postgame settlement audit
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cfb-2026-postgame-settlement-${{ github.run_id }}
          path: |
            data/settlement_scores/manifest.json
            data/settlement_scores/settlement-*.json
            data/settlement_scores/qb-postgame-evidence-*.json
            data/settlement_scores/qb-postgame-ledger-*.json
            data/settlement_scores/qb-official-gamebook-*.json
            data/settlement_scores/qb-official-gamebook-ledger-*.json
            data/settlement_scores/qb-starter-trainability-*.json
            data/settlement_scores/qb-starter-source-review-*.csv
            data/settlement_scores/step3g-grading-*.json
            data/settlement_scores/model-finishline-*.json
            data/settlement_scores/step3e-*/
          retention-days: 30
          if-no-files-found: warn
