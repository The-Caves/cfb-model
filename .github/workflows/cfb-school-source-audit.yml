name: CFB 2026 School Source Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "config/official_athletics_sites_2026.json"
      - "config/official_qb_rss_registry.json"
      - "scripts/official_school_source_registry.py"
      - "scripts/official_source_connectivity.py"
      - "scripts/official_school_source_audit.py"
      - "scripts/official_personnel_source_discovery.py"
      - "scripts/official_personnel_source_coverage.py"
      - "tests/test_official_personnel_source_discovery.py"
      - "tests/test_official_personnel_source_coverage.py"
      - "tests/test_official_athletics_coverage.py"
      - "tests/test_official_school_source_audit.py"
      - ".github/workflows/cfb-school-source-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate source mapping and evidence gates
        run: |
          python -m unittest discover -s tests -p 'test_official_athletics_coverage.py' -v
          python -m unittest discover -s tests -p 'test_official_school_source_audit.py' -v
          python -m unittest discover -s tests -p 'test_official_school_source_registry.py' -v
          python -m unittest discover -s tests -p 'test_official_personnel_source_discovery.py' -v
          python -m unittest discover -s tests -p 'test_official_personnel_source_coverage.py' -v
      - name: Assemble full canonical source registry
        run: |
          python -m scripts.official_school_source_registry \
            --aliases data/archive/2026_team_aliases.csv \
            --registry config/official_qb_rss_registry.json \
            --athletics config/official_athletics_sites_2026.json \
            --output data/context/official-school-source-registry-2026.json
      - name: Probe all 138 school sites and eight official RSS feeds
        run: |
          python -m scripts.official_source_connectivity \
            --registry config/official_qb_rss_registry.json \
            --athletics config/official_athletics_sites_2026.json \
            --output data/context/official-source-connectivity-2026.json
      - name: Freeze per-school source accessibility audit
        run: |
          python -m scripts.official_school_source_audit \
            --registry data/context/official-school-source-registry-2026.json \
            --connectivity data/context/official-source-connectivity-2026.json \
            --output data/context/official-school-source-audit-2026.json
      - name: Discover football game notes depth charts and injury sources
        run: |
          python -m scripts.official_personnel_source_discovery \
            --sites config/official_athletics_sites_2026.json \
            --output data/context/official-personnel-source-discovery-2026.json
      - name: Audit source types and preserve unresolved school gaps
        run: |
          python -m scripts.official_personnel_source_coverage \
            --source data/context/official-personnel-source-discovery-2026.json \
            --output data/context/official-personnel-source-coverage-2026.json \
            --csv-output data/context/official-personnel-source-coverage-2026.csv
      - name: Enforce full football-page coverage without overstating personnel verification
        run: |
          python -c 'import json; d=json.load(open("data/context/official-personnel-source-coverage-2026.json")); assert d["expected_teams"]==138 and d["schools_audited"]==138, "Unresolved football-page coverage"; assert d["personnel_verified_count"]==0, "Unreviewed personnel evidence promoted"'
      - name: Upload school source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-school-source-audit-${{ github.run_id }}
          path: |
            data/context/official-school-source-registry-2026.json
            data/context/official-source-connectivity-2026.json
            data/context/official-school-source-audit-2026.json
            data/context/official-personnel-source-discovery-2026.json
            data/context/official-personnel-source-coverage-2026.json
            data/context/official-personnel-source-coverage-2026.csv
          if-no-files-found: warn
          retention-days: 30
