name: CFB Website PlayerForm PR Preview Check
on:
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/site_player_props.py'
      - 'scripts/site_availability.py'
      - 'scripts/player_prop_workload.py'
      - 'tests/test_player_prop_workload.py'
      - 'tests/test_site_player_props.py'
      - 'scripts/site_player_projection_archive.py'
      - 'tests/test_site_player_projection_archive.py'
      - 'tests/test_site_ui_compact.py'
      - '.github/workflows/cfb-site-playerform-pr-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-site-player-prop-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: context-state
          path: .context-state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify compact mobile widget contracts and player source gates
        run: |
          python -m unittest discover -s tests -p 'test_site_ui_compact.py' -v
          python -m unittest discover -s tests -p 'test_site_player_props.py' -v
          python -m unittest discover -s tests -p 'test_site_availability.py' -v
          python -m unittest discover -s tests -p 'test_player_prop_workload.py' -v
          python -m unittest discover -s tests -p 'test_site_player_projection_archive.py' -v
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path("site/index.html").read_text()
          scripts=re.findall(r'<script(?:\s+[^>]*)?>([\s\S]*?)</script>',html)
          assert len(scripts)==2 and "function playerOutlook(g)" in scripts[1]
          Path("/tmp/cfb-playerform-ui.js").write_text(scripts[1])
          PY
          node --check /tmp/cfb-playerform-ui.js
      - name: Export genuine immutable 2026 pregame V03 archive
        run: python -m scripts.site_export --archive-root .context-state --output /tmp/cfb-playerform-board.json
      - name: Join actual 2025/2026 ESPN player boxes to live upcoming games
        run: |
          python -m scripts.site_player_props --dashboard /tmp/cfb-playerform-board.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/cfb-playerform-board.json"))
          p=d["player_prop_display"]
          assert p["model_scores_updated"] is False
          assert p["real_bookmaker_quotes_present"] is False
          print(json.dumps(p,indent=2))
          assert p["status"]=="CFB_SITE_PLAYERFORM_R1_STAT_RESEARCH_ONLY", p
          assert p["covered_games"]>0, "Live upcoming ESPN player/team crosswalk returned zero projections"
          assert all(g["player_props"]["real_bookmaker_prop_lines"]==0 for g in d["games"])
          assert all(q["real_bookmaker_line"] is None and q["over_probability"] is None
              for g in d["games"] for q in g["player_props"]["entries"])
          PY
      - name: Dry-run freeze of actually observed upcoming player forecasts (no Git writes)
        run: |
          python - <<'PY'
          import datetime as dt,json
          from scripts.site_player_projection_archive import freeze
          board=json.load(open("/tmp/cfb-playerform-board.json"))
          result=freeze(board,dt.datetime.now(dt.timezone.utc),"987654321")
          assert result["status"]=="ARCHIVED_PREKICKOFF_CONDITIONAL_PLAYER_STAT_DISPLAY_RESEARCH_ONLY"
          assert result["summary"]["player_stat_projections"]>0
          assert all(x["real_bookmaker_line"] is None and
                     x["not_a_betting_prop_or_validated_edge"] for x in result["rows"])
          print(json.dumps(result["summary"],sort_keys=True))
          PY
      - name: Store research-only source-smoke output
        uses: actions/upload-artifact@v4
        with:
          name: cfb-playerform-pr-smoke-${{ github.run_id }}
          path: /tmp/cfb-playerform-board.json
          retention-days: 3
          if-no-files-found: error
