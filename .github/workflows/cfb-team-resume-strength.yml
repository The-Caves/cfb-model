name: CFB 2026 Team Resume Strength Audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/team_resume_strength.py'
      - 'tests/test_team_resume_strength.py'
      - '.github/workflows/cfb-team-resume-strength.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  historical-asof-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify score-provenance and lookahead-protected resume definitions
        run: python -m unittest discover -s tests -p 'test_team_resume_strength.py' -v
      - name: Download original matched 2026 game schedule
        uses: actions/download-artifact@v4
        with:
          name: cfb-2026-data-43475676201
          run-id: 43475676201
          repository: The-Caves/cfb-model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .source-2026
      - name: Reconstruct historical team strength as-of selected earlier dates
        run: |
          for date in 2026-09-19 2026-10-03 2026-10-17 2026-10-31 2026-11-07 2026-11-13; do
            python -m scripts.team_resume_strength \
              --games .source-2026/games_2026.csv \
              --asof "$date" \
              --output "artifacts/resume-asof-$date.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-2026-source-dated-resume-metrics
          path: artifacts/resume-asof-*.json
          if-no-files-found: error
