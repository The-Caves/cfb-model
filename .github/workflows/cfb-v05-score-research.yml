name: CFB V05 Robust Score Challenger and Holdout Audit
on:
  pull_request:
    paths:
      - 'scripts/v05_robust_scores.py'
      - 'scripts/v05_score_benchmark.py'
      - 'scripts/v05_calibration.py'
      - 'tests/test_v05_robust_scores.py'
      - 'tests/test_v05_score_benchmark.py'
      - 'tests/test_v05_calibration.py'
      - '.github/workflows/cfb-v05-score-research.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  v05-matched-score-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test V05 robust source gate, calendar cutoffs, ablations, and intervals
        run: |
          python -m unittest discover -s tests -p 'test_v05_robust_scores.py' -v
          python -m unittest discover -s tests -p 'test_v05_score_benchmark.py' -v
          python -m unittest discover -s tests -p 'test_v05_calibration.py' -v
          python -m unittest discover -s tests -p 'test_v04_direct_scores.py' -v
      - name: Retrieve original retained 2026 scored-game data snapshot
        uses: actions/download-artifact@v4
        with:
          name: cfb-2026-data-41213872537
          run-id: 41213872537
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .source-original
      - name: Paired V04 and V05 weekly test on actual earlier-frozen 2026 source artifact
        run: |
          set -euo pipefail
          test -s .source-original/games_2026.csv
          python -m scripts.v05_score_benchmark \
            --games .source-original/games_2026.csv \
            --output /tmp/v05-robust-paired.json | tee /tmp/v05-summary.log
          cat /tmp/v05-summary.log >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          report=json.load(open("/tmp/v05-robust-paired.json"))
          assert report["status"]=="V05_PAIRED_WEEKLY_CHRONOLOGICAL_RESEARCH_ONLY"
          assert report["n_folds"]>=3
          assert report["matched_games"]>=100
          assert report["same_team_and_game_ids_for_all_models"]
          assert report["no_automatic_model_selection"]
          assert report["historical_market_lines_used"] is False
          assert report["historical_source_first_publication_verified"] is False
          assert report["score_model_promoted"] is False
          assert report["safe_for_betting"] is False
          assert all(len(f["game_ids"])==f["matched_games"] for f in report["folds"])
          assert all(p["cutoff"] in [f["week_start"] for f in report["folds"]]
                     for p in report["predictions"])
          assert all(v["games"]==report["matched_games"]
                     for v in report["models"].values())
          print("V05 paired result and no hindsight / no model promotion verified")
          PY
      - name: Archive reproducible prediction-level research evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfb-v05-paired-research-${{ github.run_id }}
          path: /tmp/v05-robust-paired.json
          retention-days: 30
          if-no-files-found: warn
