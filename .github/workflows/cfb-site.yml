name: CFB Research Dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/site_export.py'
      - 'scripts/site_performance.py'
      - 'tests/test_site_performance.py'
      - 'scripts/site_decision_archive.py'
      - 'scripts/personnel_results_archive.py'
      - 'tests/test_site_decision_archive.py'
      - 'scripts/site_market.py'
      - 'scripts/site_qb.py'
      - 'scripts/site_depthchart.py'
      - 'scripts/site_team_branding.py'
      - 'tests/test_site_team_branding.py'
      - 'tests/test_site_ui_compact.py'
      - 'scripts/site_matchup.py'
      - 'scripts/site_player_props.py'
      - 'scripts/site_player_projection_archive.py'
      - 'tests/test_site_player_projection_archive.py'
      - 'scripts/player_prop_workload.py'
      - 'tests/test_player_prop_workload.py'
      - 'tests/test_site_player_props.py'
      - 'tests/test_site_matchup.py'
      - 'tests/test_site_depthchart.py'
      - 'scripts/site_availability.py'
      - 'scripts/official_availability.py'
      - 'tests/test_official_availability.py'
      - 'tests/test_site_availability.py'
      - 'tests/test_site_qb.py'
      - 'tests/test_site_market.py'
      - 'tests/test_site_export.py'
      - '.github/workflows/cfb-site.yml'
  schedule:
    - cron: '33 11,14,17,20,23 * * *'
    - cron: '17,47 14-23 * * 6'
permissions:
  contents: read
concurrency:
  group: cfb-research-site
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: context-state
          path: .context-state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify compact mobile UI invariants and JavaScript syntax
        run: |
          python -m unittest discover -s tests -p 'test_site_ui_compact.py' -v
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('site/index.html').read_text()
          scripts=re.findall(r'<script(?:\s+[^>]*)?>([\s\S]*?)</script>',text)
          assert len(scripts)==2 and 'function gameCard' in scripts[1], 'Dashboard application script missing'
          Path('/tmp/cfb-ui-script.js').write_text(scripts[1])
          PY
          node --check /tmp/cfb-ui-script.js
      - name: Test forecast export
        run: python -m unittest discover -s tests -p 'test_site_export.py' -v
      - name: Test deduplicated prospective performance audit
        run: python -m unittest discover -s tests -p 'test_site_performance.py' -v
      - name: Test ESPN-sourced team colors and logos do not change forecasts
        run: python -m unittest discover -s tests -p 'test_site_team_branding.py' -v
      - name: Test recorded opportunity-share evidence and chronological baseline
        run: python -m unittest discover -s tests -p 'test_player_prop_workload.py' -v
      - name: Test independently sourced PlayerForm research overlays
        run: python -m unittest discover -s tests -p 'test_site_player_props.py' -v
      - name: Test independently archived pre-kickoff conditional player research predictions
        run: python -m unittest discover -s tests -p 'test_site_player_projection_archive.py' -v
      - name: Test source-matched market comparisons
        run: python -m unittest discover -s tests -p 'test_site_market.py' -v
      - name: Test game-specific QB status and season-passer fallback
        run: python -m unittest discover -s tests -p 'test_site_qb.py' -v
      - name: Test canonical official report parsing and Exempt exclusion
        run: python -m unittest discover -s tests -p 'test_official_availability.py' -v
      - name: Test actual official QB availability overlay
        run: python -m unittest discover -s tests -p 'test_site_availability.py' -v
      - name: Test verified team scouting overlay does not rewrite frozen picks
        run: python -m unittest discover -s tests -p 'test_site_matchup.py' -v
      - name: Test sourced QB1-QB3 depth chart parsing and cache
        run: python -m unittest discover -s tests -p 'test_site_depthchart.py' -v
      - name: Test pregame displayed decisions and market source archiving
        run: python -m unittest discover -s tests -p 'test_site_decision_archive.py' -v
      - name: Produce actual archived model projections
        run: |
          python -m scripts.site_export --archive-root .context-state --output site/data/dashboard.json | tee /tmp/site-export.txt
          cat /tmp/site-export.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Read observed free ESPN market quotes and compare research lines
        run: |
          python -m scripts.site_market --dashboard site/data/dashboard.json | tee /tmp/site-market.txt
          cat /tmp/site-market.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Overlay source-labelled QB names (no starter inference)
        run: |
          python -m scripts.site_qb --dashboard site/data/dashboard.json --history .context-state/state/qb_history_latest.json | tee /tmp/site-qb.txt
          cat /tmp/site-qb.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Overlay timestamped official conference QB statuses
        run: |
          python -m scripts.site_availability --dashboard site/data/dashboard.json | tee /tmp/site-availability.txt
          cat /tmp/site-availability.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Set daily UTC depth chart cache key
        id: depth_key
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Reuse today's public source-labeled depth charts
        uses: actions/cache@v4
        with:
          path: .cache/cfb-qb-depth-2026.json
          key: cfb-2026-qb-depth-v3-${{ steps.depth_key.outputs.date }}
      - name: Overlay ranked QB depth charts (NOT confirmed starters)
        run: |
          set -euo pipefail
          python -m scripts.site_depthchart --dashboard site/data/dashboard.json --cache .cache/cfb-qb-depth-2026.json | tee /tmp/site-depthchart.txt
          cat /tmp/site-depthchart.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Overlay source-verified run/pass/defense/turnover scouting (NOT model inputs)
        run: |
          python -m scripts.site_matchup \
            --dashboard site/data/dashboard.json \
            --source .context-state
      - name: Overlay source-reviewed player-stat outlooks (separate model; scores frozen)
        run: |
          python -m scripts.site_player_props --dashboard site/data/dashboard.json | tee /tmp/site-playerprops.txt
          cat /tmp/site-playerprops.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Overlay exact ESPN team colors and CDN logo URLs (display only)
        run: |
          python -m scripts.site_team_branding --dashboard site/data/dashboard.json | tee /tmp/team-branding.txt
          cat /tmp/team-branding.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Publish cumulative graded performance from archived prospectively captured evidence
        run: |
          python -m scripts.site_performance             --archive-root .context-state             --dashboard site/data/dashboard.json | tee /tmp/site-performance.txt
          cat /tmp/site-performance.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Report earliest today research matchups without betting claims
        run: |
          python - <<'PY'
          import datetime as dt,json
          from zoneinfo import ZoneInfo
          d=json.load(open("site/data/dashboard.json"))
          zone=ZoneInfo("America/New_York")
          today=dt.datetime.now(zone).date()
          games=[g for g in d["games"] if dt.datetime.fromisoformat(g["kickoff_utc"].replace("Z","+00:00")).astimezone(zone).date()==today]
          print("Early today model research projections (NOT validated picks):")
          for g in games[:18]:
              local=dt.datetime.fromisoformat(g["kickoff_utc"].replace("Z","+00:00")).astimezone(zone)
              m=g["model_home_margin"]
              winner=(g["home_team"] if m>0 else g["away_team"] if m<0 else "TIE") if m is not None else "PASS"
              print(local.strftime("%I:%M %p"),g["away_team"],"at",g["home_team"],"research projected winner:",winner,"home margin:",m,"total:",g["model_total"],"QB:",str(g["qb_starters_verified"])+"/2","Reports:",str(g["official_team_reports_verified"])+"/2")
          PY
      - name: Confirm research-only and missing sportsbook prices
        run: |
          python - <<'PY'
          import json
          d=json.load(open("site/data/dashboard.json"))
          assert d["schema_version"] == 2 and d["betting_status"] == "PASS_UNVALIDATED"
          assert all((g["market_home_spread"] is None or g["market_provider"]) and
                     (g["market_total"] is None or g["market_provider"]) for g in d["games"])
          assert all(not g["model_ats_side"] or g["market_home_spread"] is not None for g in d["games"])
          assert all(not g["model_ou_side"] or g["market_total"] is not None for g in d["games"])
          assert d["market_display"]["source"]=="ESPN scoreboard public observed odds"
          assert d["qb_display"]["model_features_updated"] is False
          assert d["qb_availability_display"]["changes_frozen_model_picks"] is False
          assert d["qb_availability_display"]["confirms_starting_qb"] is False
          assert d["qb_depth_display"]["confirmed_starting_QB_from_chart"] is False
          assert d["qb_depth_display"]["changes_frozen_model_picks"] is False
          assert d["matchup_display"]["changes_frozen_model"] is False
          props=d["player_prop_display"]
          assert props["model_scores_updated"] is False
          assert props["real_bookmaker_quotes_present"] is False
          assert props["role_shares_changed_yard_projections"] is False
          assert all(isinstance(g["player_availability_home"],list) and
                     isinstance(g["player_availability_away"],list) for g in d["games"])
          assert all(g["player_props"]["real_bookmaker_prop_lines"]==0 for g in d["games"])
          assert all(p["real_bookmaker_line"] is None and p["over_probability"] is None
                     for g in d["games"] for p in g["player_props"]["entries"])
          p=d["prospective_records"]
          assert p["status"]=="ARCHIVED_PROSPECTIVE_MODEL_PERFORMANCE_RESEARCH_ONLY"
          assert p["betting_status"]=="PASS_UNVALIDATED" and p["model_validated"] is False
          assert p["policies"]["su"]=="LATEST_QUALIFYING_FROZEN_FORECAST_24_TO_72H"
          assert all(p[key]["decisions"]==p[key]["wins"]+p[key]["losses"] for key in ("su","ats","ou"))
          assert d["team_brand_display"]["changes_frozen_forecast"] is False
          assert all("team_brand_home" in g and "team_brand_away" in g for g in d["games"])
          assert all("matchup_intelligence" in g for g in d["games"])
          assert all(isinstance(g["qb_depth_home"],list) and isinstance(g["qb_depth_away"],list) for g in d["games"])
          assert all(not q["confirmed_starter"] and q["source_url"].startswith("https://www.ourlads.com/") for g in d["games"] for side in ("home","away") for q in g["qb_depth_"+side])

          assert all(isinstance(g["qb_availability_home"],list) and isinstance(g["qb_availability_away"],list) for g in d["games"])
          assert all(row["source_type"]=="OFFICIAL_CONFERENCE_AVAILABILITY" and row["not_starter_confirmation"] is True for g in d["games"] for side in ("home","away") for row in g["qb_availability_"+side])

          assert all(g["qb_home"]["status"] in ("CONFIRMED_OFFICIAL","RECENT_GAME_PASSER","CONFLICT_REVIEW","UNKNOWN") and g["qb_away"]["status"] in ("CONFIRMED_OFFICIAL","RECENT_GAME_PASSER","CONFLICT_REVIEW","UNKNOWN") for g in d["games"])
          assert all(g["qb_home"]["status"]!="CONFIRMED_OFFICIAL" or g["qb_home"]["source_url"] for g in d["games"])
          print("Source-matched research board validated")
          PY
      - name: Embed data into downloadable standalone HTML
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          html=Path("site/index.html")
          source=html.read_text(encoding="utf-8")
          marker='<script id="dashboard-data" type="application/json"></script>'
          assert source.count(marker)==1, "Data insertion marker missing or duplicate"
          data=json.loads(Path("site/data/dashboard.json").read_text(encoding="utf-8"))
          payload=json.dumps(data,ensure_ascii=True,separators=(",",":")).replace("<",r"\u003c")
          html.write_text(source.replace(marker,marker.replace("</script>",payload+"</script>")),encoding="utf-8")
          print("Self-contained HTML preview contains verified forecast data")
          PY
      - name: Save portable website preview
        uses: actions/upload-artifact@v4
        with:
          name: cfb-website-preview-${{ github.run_id }}
          path: |
            site/index.html
            site/README.md
            site/data/dashboard.json
          retention-days: 7
      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  archive:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: cfb-context-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: cfb-website-preview-${{ github.run_id }}
          path: site
      - name: Install archival dependencies
        run: python -m pip install -r requirements.txt
      - name: Save immutable displayed pregame picks, providers, spreads, totals, timestamps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python -m scripts.site_decision_archive --dashboard site/data/dashboard.json | tee /tmp/displayed-decisions.txt
          cat /tmp/displayed-decisions.txt >> "$GITHUB_STEP_SUMMARY"
          echo "Persisted research display snapshots are NOT synchronized model/market pre-decision backtests or wager records." >> "$GITHUB_STEP_SUMMARY"
      - name: Freeze append-only source-captured conditional player yard forecasts for future validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python -m scripts.site_player_projection_archive --dashboard site/data/dashboard.json | tee /tmp/displayed-player-stats.txt
          cat /tmp/displayed-player-stats.txt >> "$GITHUB_STEP_SUMMARY"
          echo "Player stat research snapshots are not sportsbook lines, probabilistic forecasts, or validated profit expectations." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Check whether public Pages is already enabled
        id: enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" = "200" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "404" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Public Pages is disabled; to publish publicly use Settings > Pages > Source: GitHub Actions. Preview artifact remains available." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Cannot verify Pages: HTTP $code" >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
        if: steps.enabled.outputs.ready == 'true'
      - uses: actions/deploy-pages@v4
        if: steps.enabled.outputs.ready == 'true'
        id: publish
