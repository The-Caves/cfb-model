name: CFB V10 Actual Drive Intake Research
on:
  push:
    branches: [main]
    paths:
      - 'scripts/possession_drive_ingest.py'
      - 'tests/test_possession_drive_ingest.py'
      - '.github/workflows/cfb-v10-possessions.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cfb-v10-possessions
  cancel-in-progress: true
jobs:
  collect-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run possession scoring ownership tests
        run: python -m unittest discover -s tests -p 'test_possession_drive_ingest.py' -v
      - name: Retrieve 2026 independently verified ESPN schedule and finals
        uses: actions/download-artifact@v4
        with:
          name: cfb-2026-data-43475676201
          run-id: 43475676201
          repository: The-Caves/cfb-model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .source-2026
      - name: Retrieve actual ESPN completed possessions with score ownership gates
        run: |
          python -m scripts.possession_drive_ingest \
            --games .source-2026/games_2026.csv \
            --output artifacts/v10-2026-observed-possessions.json \
            --cap 400 --workers 8
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-v10-source-verified-drives
          path: artifacts/v10-2026-observed-possessions.json
          if-no-files-found: error
