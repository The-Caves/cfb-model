name: CFB V10 Actual Drive Intake Research
on:
  push:
    branches: [main]
    paths:
      - 'scripts/possession_drive_ingest.py'
      - 'tests/test_possession_drive_ingest.py'
      - 'tests/test_v10_possession_sim.py'
      - 'scripts/v10_possession_sim.py'
      - 'scripts/v10_possession_backtest.py'
      - '.github/workflows/cfb-v10-possessions.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cfb-v10-possessions
  cancel-in-progress: true
jobs:
  collect-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run possession ingestion, source ownership and matchup Monte Carlo tests
        run: |
          python -m unittest discover -s tests -p 'test_possession_drive_ingest.py' -v
          python -m unittest discover -s tests -p 'test_v10_possession_sim.py' -v
      - name: Retrieve 2026 independently verified ESPN schedule and finals
        uses: actions/download-artifact@v4
        with:
          name: cfb-2026-data-43475676201
          run-id: 43475676201
          repository: The-Caves/cfb-model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .source-2026
      - name: Retrieve the original 2026 historical V04 week-by-week baseline
        uses: actions/download-artifact@v4
        with:
          name: cfb-v09-retro-backtest
          run-id: 43484364739
          repository: The-Caves/cfb-model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .baseline-2026
      - uses: actions/checkout@v4
        with:
          ref: context-state
          path: .context-state
          fetch-depth: 1
      - name: Retrieve actual ESPN completed possessions with score ownership gates
        run: |
          python -m scripts.possession_drive_ingest \
            --games .source-2026/games_2026.csv \
            --output artifacts/v10-2026-observed-possessions.json \
            --cap 800 --workers 12
      - name: True possession Monte Carlo vs same historic V04 games and sportsbook lines
        run: |
          python -m scripts.v10_possession_backtest \
            --source artifacts/v10-2026-observed-possessions.json \
            --advanced .source-2026/advanced/team_game_advanced_2026.csv \
            --baseline .baseline-2026/v04-2026-weekly-baseline.json \
            --games .source-2026/games_2026.csv \
            --market-root .context-state \
            --output artifacts/v10-possession-v04-paired-backtest.json \
            --min-past 35 --trials 500 | tee artifacts/v10-possessions-summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-v10-source-verified-drives
          path: |
            artifacts/v10-2026-observed-possessions.json
            artifacts/v10-possession-v04-paired-backtest.json
            artifacts/v10-possessions-summary.txt
          if-no-files-found: error
