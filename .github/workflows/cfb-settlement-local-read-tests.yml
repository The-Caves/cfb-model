name: CFB Settlement Local Archive Rate-Limit Fix Validation
on:
  push:
    branches: [fix/cfb-settlement-local-archive-reads]
    paths:
      - 'scripts/personnel_forecast_grade.py'
      - 'tests/test_personnel_forecast_local_archive.py'
      - '.github/workflows/cfb-outcome-settlement.yml'
      - '.github/workflows/cfb-settlement-local-read-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify frozen forecast receipts, existing historical grading and local checkout security
        run: |
          python -m unittest discover -s tests -p 'test_personnel_forecast_grade.py' -v
          python -m unittest discover -s tests -p 'test_personnel_forecast_local_archive.py' -v
          python -m unittest discover -s tests -p 'test_context_archive.py' -v
      - name: Validate settlement update requires refreshed checkout, not missing API
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path(".github/workflows/cfb-outcome-settlement.yml").read_text()
          assert "Refresh immutable context-state checkout after postgame writes" in s
          assert "--archive-root .context-state" in s
          from scripts.personnel_forecast_grade import _archived_bytes
          assert callable(_archived_bytes)
          PY
      - name: Full repository test suite
        run: python -m unittest discover -s tests -q
