name: CFB Settlement Local Archive Rate-Limit Fix Validation
on:
  push:
    branches: [fix/cfb-settlement-local-archive-reads]
    paths:
      - 'scripts/personnel_forecast_grade.py'
      - 'tests/test_personnel_forecast_local_archive.py'
      - '.github/workflows/cfb-outcome-settlement.yml'
      - '.github/workflows/cfb-settlement-local-read-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify frozen forecast receipts, existing historical grading and local checkout security
        run: |
          python -m unittest discover -s tests -p 'test_personnel_forecast_grade.py' -v
          python -m unittest discover -s tests -p 'test_personnel_forecast_local_archive.py' -v
          python -m unittest discover -s tests -p 'test_context_archive.py' -v
      - name: Validate settlement update requires refreshed checkout, not missing API
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path(".github/workflows/cfb-outcome-settlement.yml").read_text()
          assert "Refresh immutable context-state checkout after postgame writes" in s
          assert "--archive-root .context-state" in s
          from scripts.personnel_forecast_grade import _archived_bytes
          assert callable(_archived_bytes)
          PY
      - name: Checkout genuine immutable context-state branch
        uses: actions/checkout@v4
        with:
          ref: context-state
          path: .context-state
          persist-credentials: false
      - name: Verify entire real grading archive from disk with zero GitHub GETs
        run: |
          python - <<'PY'
          from unittest.mock import patch
          from scripts.personnel_forecast_grade import read
          with patch("scripts.personnel_forecast_grade.store.get_blob_file",
                     side_effect=AssertionError("No per-file GitHub API calls")):
              index, outcomes, pregame, forecasts, models, finals, prior=read(".context-state")
          assert isinstance(index["games"],dict)
          assert isinstance(outcomes["games"],dict)
          assert len(models)==len(forecasts["runs"])
          print("Authentic graded archive locally verified:",
                len(index["games"]),"grades",
                len(outcomes["games"]),"accepted final games",
                len(models),"immutable forecast runs",
                len(prior),"verified earlier grades")
          PY
      - name: Full repository test suite
        run: python -m unittest discover -s tests -q
