name: CFB Official Gameweek QB Watch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/qb_gameweek_watch.py'
      - 'tests/test_qb_gameweek_watch.py'
      - 'scripts/qb_official_notes_watch.py'
      - 'tests/test_qb_official_notes_watch.py'
      - 'scripts/qb_source_watch_archive.py'
      - 'tests/test_qb_source_watch_archive.py'
      - 'scripts/qb_media_notes_index_watch.py'
      - 'tests/test_qb_media_notes_index_watch.py'
      - 'config/official_football_media_index_pilot_2026.json'
      - 'config/official_gameweek_sources_2026.json'
      - '.github/workflows/cfb-qb-gameweek-watch.yml'
  schedule:
    - cron: '17 11,15,19,22 * * *'
permissions:
  contents: write
jobs:
  watch:
    concurrency:
      group: cfb-context-state
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source-change logic and fail-closed QB1 rules
        run: python -m unittest discover -s tests -p 'test_qb_gameweek_watch.py' -v
      - name: Install lightweight PDF text extractor and test reviewed notes screening
        run: |
          python -m pip install -r requirements.txt 'pypdf>=5,<7'
          python -m unittest discover -s tests -p 'test_qb_official_notes_watch.py' -v
      - name: Restore previous official-page fingerprints
        uses: actions/cache/restore@v4
        with:
          key: cfb-official-gameweek-watch-v1-${{ github.run_id }}
          restore-keys: |
            cfb-official-gameweek-watch-v1-
          path: |
            .qb-watch/previous.json
            .qb-watch/previous-notes.json
      - name: Monitor dated university articles and generate review-only changes
        run: |
          set -euo pipefail
          mkdir -p data/qb_review .qb-watch
          python -m scripts.qb_gameweek_watch \
            --config config/official_gameweek_sources_2026.json \
            --previous .qb-watch/previous.json \
            --output data/qb_review/official_gameweek_language_watch.json \
            --csv data/qb_review/official_gameweek_language_watch.csv
          python - <<'PY'
          import json,os
          from pathlib import Path
          page=Path("data/qb_review/official_gameweek_language_watch.json")
          data=json.loads(page.read_text())
          assert data["status"]=="OFFICIAL_GAMEWEEK_QB_LANGUAGE_REVIEW_ONLY"
          assert data["betting_status"]=="PASS_UNVALIDATED"
          assert data["confirmed_starters_added"]==0
          assert data["model_predictions_modified"] is False
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("### Verified school QB article watch\n\n")
              f.write("Automated language detection does not confirm QB1 or recompute picks.\n\n")
              f.write(json.dumps(data["summary"],indent=2)+"\n")
          print(json.dumps(data["summary"],sort_keys=True))
          if data["monitor_health"]=="DEGRADED_ALL_ACTIVE_SOURCES_FAILED":
              raise SystemExit("MONITOR_DEGRADED: all active official previews returned unreadable content; no QB status may be inferred")
          PY
          cp data/qb_review/official_gameweek_language_watch.json .qb-watch/previous.json
      - name: Read direct official football notes PDFs and flag change/possible QB language
        run: |
          set -euo pipefail
          python -m scripts.qb_official_notes_watch             --config config/official_gameweek_sources_2026.json             --previous .qb-watch/previous-notes.json             --output data/qb_review/official_gameweek_notes_watch.json             --csv data/qb_review/official_gameweek_notes_watch.csv
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path("data/qb_review/official_gameweek_notes_watch.json").read_text())
          assert data["status"]=="OFFICIAL_QB_NOTES_DOCUMENT_REVIEW_ONLY"
          assert data["official_starting_qb_confirmations"]==0
          assert data["model_predictions_modified"] is False
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("\n### Official game-note PDF screening\n\n")
              f.write(json.dumps(data["summary"],indent=2)+"\n")
              f.write("PDF keyword matches require manual source review; notes are not verified starters.\n")
          print(json.dumps(data["summary"],sort_keys=True))
          PY
          cp data/qb_review/official_gameweek_notes_watch.json .qb-watch/previous-notes.json
      - name: Test exact fixture-specific football media-center note discovery
        run: python -m unittest discover -s tests -p 'test_qb_media_notes_index_watch.py' -v
      - name: Check official media center for current game-note link publication
        run: |
          set -euo pipefail
          python -m scripts.qb_media_notes_index_watch \
            --config config/official_football_media_index_pilot_2026.json \
            --output data/qb_review/official_game_notes_media_index_leads.json
      - name: Test strict archived QB-source observation clocks
        run: python -m unittest discover -s tests -p 'test_qb_source_watch_archive.py' -v
      - name: Preserve immutable observed source evidence on context-state branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python -m scripts.qb_source_watch_archive \
            --html data/qb_review/official_gameweek_language_watch.json \
            --notes data/qb_review/official_gameweek_notes_watch.json | tee /tmp/qb-source-archive-result.json
          cat /tmp/qb-source-archive-result.json >> "$GITHUB_STEP_SUMMARY"
          echo "Stored source change observations only; no confirmed starting QBs or modified picks." >> "$GITHUB_STEP_SUMMARY"
      - name: Cache page fingerprints for next scheduled scan
        uses: actions/cache/save@v4
        with:
          key: cfb-official-gameweek-watch-v1-${{ github.run_id }}
          path: |
            .qb-watch/previous.json
            .qb-watch/previous-notes.json
      - name: Publish official QB source changes and injury-language review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-official-qb-review-watch-${{ github.run_id }}
          path: data/qb_review/
          if-no-files-found: warn
          retention-days: 30
