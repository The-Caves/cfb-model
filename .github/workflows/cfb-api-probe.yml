name: CFB Official Player Report API Probe
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[probe-api]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check official public embedded publisher report format
        run: python -m scripts.report_api_probe
      - name: Archive diagnostic response shapes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-official-public-availability-api-${{ github.run_id }}
          path: data/availability_api_probe/
          retention-days: 7
