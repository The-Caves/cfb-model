name: CFB 2026 Data Intake
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 10,16,23 * * *'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Reproduce archived-vs-ESPN score reconciliation from frozen snapshots
        run: python scripts/reconcile_scores.py --archive data/archive/2026_v09_scores_unverified.csv --live data/snapshots/espn_completed_2026_asof_2026-10-21.csv --aliases data/archive/2026_team_aliases.csv --output data/reconciliation_snapshot
      - name: Publish deterministic audit report
        uses: actions/upload-artifact@v4
        with:
          name: cfb-2026-snapshot-audit-${{ github.run_id }}
          path: data/reconciliation_snapshot/
          retention-days: 30
  ingest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Fetch completed 2026 games and write manifest
        run: python scripts/ingest_espn.py --start 2026-08-01 --output data
      - name: Build as-of 2026 team profiles
        run: python scripts/build_profiles.py --games data/games_2026.csv --output data
      - name: Audit archived v0.9 scores against current ESPN finals
        run: python scripts/reconcile_scores.py --archive data/archive/2026_v09_scores_unverified.csv --live data/games_2026.csv --aliases data/archive/2026_team_aliases.csv --output data/reconciliation
      - name: Archive results and raw snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-2026-data-${{ github.run_id }}
          path: |
            data/manifest.json
            data/profile_manifest.json
            data/reconciliation/
            data/team_profiles_2026.csv
            data/games_2026.csv
            data/raw/
          if-no-files-found: warn
          retention-days: 30
