name: CFB 2026 Data Intake
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      games:
        description: 'Optional exact Away at Home matchups or ESPN game IDs, one per line'
        required: false
        type: string
  schedule:
    - cron: '17 10,16,23 * * *'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Reproduce archived-vs-ESPN score reconciliation from frozen snapshots
        run: python scripts/reconcile_scores.py --archive data/archive/2026_v09_scores_unverified.csv --live data/snapshots/espn_completed_2026_asof_2026-10-21_eastern.csv --aliases data/archive/2026_team_aliases.csv --output data/reconciliation_snapshot
      - name: Publish deterministic audit report
        uses: actions/upload-artifact@v4
        with:
          name: cfb-2026-snapshot-audit-${{ github.run_id }}
          path: data/reconciliation_snapshot/
          retention-days: 30
  ingest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-intake]'))
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: cfb-context-state
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Fetch completed 2026 games and write manifest
        run: python scripts/ingest_espn.py --start 2026-08-01 --output data
      - name: Capture free ESPN market observations for upcoming dates
        run: |
          mkdir -p data/free_market
          for offset in 0 1 2 3; do
            day="$(date -u -d "+$offset day" +%F)"
            python -m scripts.free_market_capture --date "$day" --output "data/free_market/espn-${day}-${{ github.run_id }}.json"
          done
      - name: Archive free market snapshots without inventing sportsbook spreads
        uses: actions/upload-artifact@v4
        with:
          name: cfb-free-market-${{ github.run_id }}
          path: data/free_market/
          if-no-files-found: error
          retention-days: 30
      - name: Persist immutable free market snapshots beyond artifact expiry
        run: python -m scripts.free_market_archive --market-dir data/free_market
      - name: Build as-of 2026 team profiles
        run: python scripts/build_profiles.py --games data/games_2026.csv --output data --registry data/archive/2026_team_aliases.csv
      - name: Audit archived v0.9 scores against current ESPN finals
        run: python scripts/reconcile_scores.py --archive data/archive/2026_v09_scores_unverified.csv --live data/games_2026.csv --aliases data/archive/2026_team_aliases.csv --output data/reconciliation
      - name: Ingest provider 2026 PBP and advanced-drive releases (research only)
        id: advanced
        run: python scripts/ingest_advanced.py --games data/games_2026.csv --registry data/archive/2026_team_aliases.csv --output data/advanced
      - name: Merge scoreboard and advanced 2026 team profiles
        run: python scripts/combine_profiles.py --scores data/team_profiles_2026.csv --advanced data/advanced/team_profiles_advanced_2026.csv --expected-teams 138 --output data/enriched
      - name: Build checksummed retrospective weekly profiles (v0.4 step 1)
        run: |
          python -m scripts.weekly_profiles \
            --games data/games_2026.csv \
            --advanced data/advanced/team_game_advanced_2026.csv \
            --manifest data/advanced/advanced_manifest.json \
            --registry data/archive/2026_team_aliases.csv \
            --through-date "$(date -u +%F)" \
            --output data/weekly_profiles
      - name: Fit and compare retrospective 2026 advanced model v0.3 (NOT betting validated)
        run: |
          python -m scripts.model_v03 \
            --games data/games_2026.csv \
            --advanced data/advanced/team_game_advanced_2026.csv \
            --manifest data/advanced/advanced_manifest.json \
            --output data/model_v03
      - name: Evaluate isolated home-margin recency candidate (research only, no model promotion)
        run: |
          python -m scripts.home_bias_candidate \
            --features data/model_v03/weekly_pregame_features.csv \
            --labels data/model_v03/weekly_postgame_labels.csv \
            --output data/model_v03/home-bias-candidate-research.json
      - name: Compare 2026 model features across chronological test weeks (research only)
        run: |
          python -m scripts.feature_consistency_audit \
            --features data/model_v03/weekly_pregame_features.csv \
            --labels data/model_v03/weekly_postgame_labels.csv \
            --output data/model_v03/feature_consistency
      - name: Test four prioritized matchup feature groups without model promotion
        run: |
          python -m scripts.experimental_matchup_features \
            --games data/games_2026.csv \
            --advanced data/advanced/team_game_advanced_2026.csv \
            --manifest data/advanced/advanced_manifest.json \
            --output data/model_v03/matchup_experiments
      - name: Audit retrospective backtest evidence for milestones 3-6
        run: |
          python -m scripts.backtest_evidence_gate \
            --backtest data/model_v03/research_backtest.json \
            --output data/model_v03/backtest-evidence-gate.json
      - name: Collect timestamped upcoming schedules, rest, travel proxies, weather and reviewed personnel
        run: python -m scripts.ingest_game_context --raw-dir data/raw --availability-csv data/manual/availability_2026.csv --output data/context --horizon-days 10 --auto-official
      - name: Inventory nationwide 2026 personnel sources
        run: |
          python -m scripts.personnel_source_inventory \
            --aliases data/archive/2026_team_aliases.csv \
            --registry config/official_qb_rss_registry.json \
            --output data/context/personnel-source-inventory-2026.json \
            --backlog data/context/personnel-source-expansion-backlog-2026.csv
      - name: Discover athletics source candidates for every FBS school (review only)
        continue-on-error: true
        run: |
          python -m scripts.athletics_source_discovery \
            --aliases data/archive/2026_team_aliases.csv \
            --output data/context/athletics-source-candidates-2026.json
      - name: Assemble canonical 138-school official source review registry
        run: |
          python -m scripts.official_school_source_registry \
            --aliases data/archive/2026_team_aliases.csv \
            --registry config/official_qb_rss_registry.json \
            --discovery data/context/athletics-source-candidates-2026.json \
            --athletics config/official_athletics_sites_2026.json \
            --output data/context/official-school-source-registry-2026.json
      - name: Probe official RSS source connectivity
        continue-on-error: true
        run: |
          python -m scripts.official_source_connectivity \
            --registry config/official_qb_rss_registry.json \
            --athletics config/official_athletics_sites_2026.json \
            --output data/context/official-source-connectivity-2026.json
      - name: Merge full 138-school source reachability audit
        run: |
          python -m scripts.official_school_source_audit \
            --registry data/context/official-school-source-registry-2026.json \
            --connectivity data/context/official-source-connectivity-2026.json \
            --output data/context/official-school-source-audit-2026.json
      - name: Preserve nationwide athletics discovery and source-expansion audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-2026-personnel-source-audit-${{ github.run_id }}
          path: |
            data/context/personnel-source-inventory-2026.json
            data/context/personnel-source-expansion-backlog-2026.csv
            data/context/athletics-source-candidates-2026.json
            data/context/official-school-source-registry-2026.json
            data/context/official-source-connectivity-2026.json
            data/context/official-school-source-audit-2026.json
          if-no-files-found: warn
          retention-days: 30
      - name: Discover official QB news candidates and build review queue
        run: |
          python -m scripts.qb_official_news_watch \
            --context data/context/upcoming_game_context_2026.json \
            --output data/context/qb-official-news.json \
            --registry config/official_qb_rss_registry.json
          python -m scripts.qb_review_queue \
            --context data/context/upcoming_game_context_2026.json \
            --news data/context/qb-official-news.json \
            --output data/context/qb-review-queue.json \
            --review-csv data/context/qb-review-queue.csv
      - name: Audit actual verified QB and injury-report coverage
        run: |
          python -m scripts.personnel_coverage_audit \
            --context data/context/upcoming_game_context_2026.json \
            --review-queue data/context/qb-review-queue.json \
            --output data/context/qb-coverage-audit.json
          python -m scripts.qb_milestone_acceptance \
            --news data/context/qb-official-news.json \
            --queue data/context/qb-review-queue.json \
            --coverage data/context/qb-coverage-audit.json \
            --output data/context/qb-milestone-acceptance.json
          cat data/context/qb-milestone-acceptance.json >> "$GITHUB_STEP_SUMMARY"
      - name: Audit injury source readiness by time to kickoff
        run: |
          python -m scripts.injury_source_readiness \
            --context data/context/upcoming_game_context_2026.json \
            --output data/context/injury-source-readiness.json
      - name: Freeze observed pregame research evidence (v0.4 Step 2)
        run: |
          python -m scripts.pregame_evidence \
            --games data/games_2026.csv \
            --advanced data/advanced/team_game_advanced_2026.csv \
            --advanced-manifest data/advanced/advanced_manifest.json \
            --score-manifest data/manifest.json \
            --context data/context/upcoming_game_context_2026.json \
            --registry data/archive/2026_team_aliases.csv \
            --output data/pregame_evidence \
            --run-id "${{ github.run_id }}"
      - name: Join observed pregame QB and availability with team profiles (Step 3C)
        run: |
          python -m scripts.personnel_capture \
            --capture "data/pregame_evidence/capture-${{ github.run_id }}.json" \
            --context data/context/upcoming_game_context_2026.json \
            --output data/pregame_evidence
      - name: Freeze observed weather-style and replacement-count matchup features
        run: |
          python -m scripts.weather_matchups \
            --joined "data/pregame_evidence/personnel-joined-${{ github.run_id }}.json" \
            --context data/context/upcoming_game_context_2026.json \
            --output "data/pregame_evidence/weather-matchups-${{ github.run_id }}.json"
          python -m scripts.personnel_replacement_capture \
            --joined "data/pregame_evidence/personnel-joined-${{ github.run_id }}.json" \
            --context data/context/upcoming_game_context_2026.json \
            --output "data/pregame_evidence/replacement-counts-${{ github.run_id }}.json"
      - name: Persist observed pregame context and link completed results (Step 3D)
        run: |
          python -m scripts.personnel_results_archive \
            --capture "data/pregame_evidence/capture-${{ github.run_id }}.json" \
            --personnel "data/pregame_evidence/personnel-joined-${{ github.run_id }}.json" \
            --games data/games_2026.csv \
            --manifest data/manifest.json \
            --output "data/pregame_evidence/step3d-archive-${{ github.run_id }}.json"
      - name: Verify dataset integrity and personnel ablation readiness (Step 3E)
        run: |
          python -m scripts.personnel_archive_dataset \
            --output "data/pregame_evidence/step3e-${{ github.run_id }}"
      - name: Run observed chronological multifactor research backtest
        run: |
          python -m scripts.multifactor_walkforward \
            --dataset "data/pregame_evidence/step3e-${{ github.run_id }}" \
            --weather "data/pregame_evidence/weather-matchups-${{ github.run_id }}.json" \
            --replacement "data/pregame_evidence/replacement-counts-${{ github.run_id }}.json" \
            --output "data/pregame_evidence/multifactor-walkforward-${{ github.run_id }}.json"
      - name: Freeze Step 3F preregistered research-readiness diagnostics
        run: |
          python -m scripts.personnel_validation_readiness \
            --dataset-dir "data/pregame_evidence/step3e-${{ github.run_id }}" \
            --output "data/pregame_evidence/step3e-${{ github.run_id }}/step3f-readiness.json"
      - name: Audit verified game-specific QB starter and replacement-event trainability
        run: |
          set -euo pipefail
          python -m scripts.qb_trainability_audit \
            --dataset-dir "data/pregame_evidence/step3e-${{ github.run_id }}" \
            --output "data/pregame_evidence/step3e-${{ github.run_id }}/qb-trainability-readiness.json" | tee /tmp/qb-trainability.txt
          cat /tmp/qb-trainability.txt >> "$GITHUB_STEP_SUMMARY"
          echo "No guessed QB starters, replacement-value penalties or retrospective medical data." >> "$GITHUB_STEP_SUMMARY"
      - name: Freeze genuine 2026 prospective baseline research forecasts (Step 3G)
        run: |
          python -m scripts.personnel_forecast \
            --joined "data/pregame_evidence/personnel-joined-${{ github.run_id }}.json" \
            --games data/games_2026.csv \
            --advanced data/advanced/team_game_advanced_2026.csv \
            --advanced-manifest data/advanced/advanced_manifest.json \
            --score-manifest data/manifest.json \
            --output "data/pregame_evidence/step3g-forecast-${{ github.run_id }}.json"
      - name: Export frozen research projections for private dashboard preview
        run: |
          python -m scripts.site_forecast_export \
            --forecast "data/pregame_evidence/step3g-forecast-${{ github.run_id }}.json" \
            --output data/site_preview/dashboard.json
      - name: Archive dashboard preview (not a public deployment)
        uses: actions/upload-artifact@v4
        with:
          name: cfb-site-preview-${{ github.run_id }}
          path: data/site_preview/dashboard.json
          if-no-files-found: error
          retention-days: 30
      - name: Compare frozen forecast with pre-decision free market snapshots
        run: |
          python -m scripts.free_market_compare \
            --forecast "data/pregame_evidence/step3g-forecast-${{ github.run_id }}.json" \
            --market-dir data/free_market \
            --output "data/pregame_evidence/free-market-comparison-${{ github.run_id }}.json"
      - name: Archive frozen market comparisons for future verified settlement
        run: |
          python -m scripts.free_market_comparison_archive \
            --comparison "data/pregame_evidence/free-market-comparison-${{ github.run_id }}.json"
      - name: Upload free market model comparison
        uses: actions/upload-artifact@v4
        with:
          name: cfb-market-comparison-${{ github.run_id }}
          path: data/pregame_evidence/free-market-comparison-*.json
          if-no-files-found: error
          retention-days: 30
      - name: Audit verified starting-QB readiness for frozen forecast
        run: |
          python -m scripts.qb_readiness_gate \
            --forecast "data/pregame_evidence/step3g-forecast-${{ github.run_id }}.json" \
            --output "data/pregame_evidence/qb-readiness-${{ github.run_id }}.json"
      - name: Publish requested matchup predictions
        if: (github.event_name == 'workflow_dispatch' && inputs.games != '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-intake]'))
        env:
          REQUESTED_GAMES: ${{ inputs.games }}
        run: |
          if [ -n "$REQUESTED_GAMES" ]; then
            python -m scripts.manual_model_picks --forecast "data/pregame_evidence/step3g-forecast-${{ github.run_id }}.json" --requested "$REQUESTED_GAMES" --output data/pregame_evidence/requested-model-picks.json
          elif [ -s data/manual/model_picks_request.txt ]; then
            python -m scripts.manual_model_picks --forecast "data/pregame_evidence/step3g-forecast-${{ github.run_id }}.json" --requested "$(cat data/manual/model_picks_request.txt)" --output data/pregame_evidence/requested-model-picks.json
          fi
          if [ -f data/pregame_evidence/requested-model-picks.md ]; then
            cat data/pregame_evidence/requested-model-picks.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Grade previously frozen prospective research against observed finals (Step 3G.1)
        run: |
          python -m scripts.personnel_forecast_grade \
            --output "data/pregame_evidence/step3g-grading-${{ github.run_id }}.json"
      - name: Archive independently verified completed game scores for market settlement
        run: |
          python -m scripts.market_finals_archive \
            --games data/games_2026.csv \
            --manifest data/manifest.json \
            --output "data/pregame_evidence/market-finals-${{ github.run_id }}.json"
      - name: Match frozen market comparisons to independently verified final scores
        run: |
          python -m scripts.free_market_final_match \
            --output "data/pregame_evidence/free-market-final-matches-${{ github.run_id }}.json"
      - name: Diagnose unique frozen games awaiting verified final settlement
        run: |
          python -m scripts.free_market_settlement_diagnostic \
            --matches "data/pregame_evidence/free-market-final-matches-${{ github.run_id }}.json" \
            --games data/games_2026.csv \
            --output "data/pregame_evidence/market-settlement-diagnostic-${{ github.run_id }}.json"
      - name: Grade verified ATS and over-under selections (research only)
        run: |
          python -m scripts.free_market_final_grade \
            --matches "data/pregame_evidence/free-market-final-matches-${{ github.run_id }}.json" \
            --output "data/pregame_evidence/free-market-final-grades-${{ github.run_id }}.json"
      - name: Report cumulative deduplicated prospective SU ATS and totals performance
        run: |
          python -m scripts.free_market_performance \
            --matches "data/pregame_evidence/free-market-final-matches-${{ github.run_id }}.json" \
            --grades "data/pregame_evidence/free-market-final-grades-${{ github.run_id }}.json" \
            --output "data/pregame_evidence/free-market-performance-${{ github.run_id }}.json"
      - name: Audit full frozen-market-to-final lifecycle and cumulative performance
        run: |
          python -m scripts.free_market_acceptance \
            --matches "data/pregame_evidence/free-market-final-matches-${{ github.run_id }}.json" \
            --grades "data/pregame_evidence/free-market-final-grades-${{ github.run_id }}.json" \
            --performance "data/pregame_evidence/free-market-performance-${{ github.run_id }}.json" \
            --output "data/pregame_evidence/free-market-acceptance-${{ github.run_id }}.json"
      - name: Consolidated model finish-line and graded performance audit
        run: |
          python -m scripts.model_finishline \
            --readiness "data/pregame_evidence/step3e-${{ github.run_id }}/step3f-readiness.json" \
            --grading "data/pregame_evidence/step3g-grading-${{ github.run_id }}.json" \
            --output "data/pregame_evidence/model-finishline-${{ github.run_id }}.json" \
            --context data/context/upcoming_game_context_2026.json
      - name: Confirm GitHub-only research storage
        run: echo "GitHub Actions and context-state are the configured research storage; no AWS credentials or paid archive calls." >> "$GITHUB_STEP_SUMMARY"
      - name: Archive results and raw snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-2026-data-${{ github.run_id }}
          path: |
            data/manifest.json
            data/profile_manifest.json
            data/advanced/advanced_manifest.json
            data/advanced/team_game_advanced_2026.csv
            data/advanced/team_profiles_advanced_2026.csv
            data/enriched/
            data/model_v03/
            data/weekly_profiles/
            data/pregame_evidence/
            data/context/
            data/reconciliation/
            data/team_profiles_2026.csv
            data/games_2026.csv
            data/raw/
          if-no-files-found: warn
          retention-days: 30

      - name: Snapshot full advanced release files on manual runs
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cfb-2026-advanced-raw-${{ github.run_id }}
          path: data/advanced/raw/
          if-no-files-found: ignore
          retention-days: 14
