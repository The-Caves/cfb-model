name: CFB 2026 Data Intake
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 10,16,23 * * *'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  ingest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Fetch completed 2026 games and write manifest
        run: python scripts/ingest_espn.py --start 2026-08-01 --output data
      - name: Build as-of 2026 team profiles
        run: python scripts/build_profiles.py --games data/games_2026.csv --output data
      - name: Archive results and raw snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-2026-data-${{ github.run_id }}
          path: |
            data/manifest.json
            data/profile_manifest.json
            data/team_profiles_2026.csv
            data/games_2026.csv
            data/raw/
          if-no-files-found: warn
          retention-days: 30
