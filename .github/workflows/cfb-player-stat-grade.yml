name: CFB PlayerForm Prospective Stat Grading
on:
  pull_request:
    paths:
      - 'scripts/player_prop_prospective_stat_grade.py'
      - 'scripts/site_player_stat_performance.py'
      - 'scripts/site_player_projection_archive.py'
      - 'scripts/site_player_props.py'
      - 'tests/test_player_prop_prospective_stat_grade.py'
      - 'tests/test_site_player_stat_performance.py'
      - '.github/workflows/cfb-player-stat-grade.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/player_prop_prospective_stat_grade.py'
      - 'scripts/site_player_stat_performance.py'
      - 'scripts/site_player_projection_archive.py'
      - 'scripts/site_player_props.py'
      - '.github/workflows/cfb-player-stat-grade.yml'
  workflow_dispatch:
  schedule:
    - cron: '19 10 * 8-12,1 *'
permissions:
  contents: read
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: cfb-context-state
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Checkout genuinely archived pregame player-stat snapshots
        uses: actions/checkout@v4
        with:
          ref: context-state
          path: .context-state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify complete official game and player stat evidence rules
        run: |
          python -m unittest discover -s tests -p 'test_player_prop_prospective_stat_grade.py' -v
          python -m unittest discover -s tests -p 'test_site_player_stat_performance.py' -v
          python -m unittest discover -s tests -p 'test_site_player_projection_archive.py' -v
      - name: Fetch fresh season schedules and player boxes, grade real frozen forecasts
        run: |
          mkdir -p data/player_props
          python -m scripts.player_prop_prospective_stat_grade \
            --archive-root .context-state \
            --output data/player_props/prospective_player_stat_grade.json
      - name: Append current as-observed summary without editing frozen source receipts
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          from scripts.player_prop_prospective_stat_grade import publish_latest
          report=json.load(open("data/player_props/prospective_player_stat_grade.json"))
          print(publish_latest(report))
          PY
      - name: Publish grade artifact and open research audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-player-stat-prospective-grade-${{ github.run_id }}
          path: data/player_props/prospective_player_stat_grade.json
          retention-days: 30
          if-no-files-found: warn
